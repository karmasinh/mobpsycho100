# ==========================================
# CONFIGURACIÓN PRINCIPAL - RESTAURANTE
# ==========================================

# Servidor
server.port=8080
server.servlet.context-path=/api

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/taller3
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT
app.jwt.secret=UmVzdGF1cmFudGVQZW5zaW9uU2VjcmV0S2V5TXV5TGFyZ2EyMDI2QW50aGlheUJvbGl2aWE=
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Seguridad: max intentos antes de bloqueo
app.security.max-login-attempts=3

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Scheduler habilitado
spring.task.scheduling.pool.size=5

# Logs
logging.level.com.restaurante=INFO
logging.level.org.springframework.security=WARN
