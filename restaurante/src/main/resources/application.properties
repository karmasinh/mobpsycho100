# ==========================================
# CONFIGURACIÓN PRINCIPAL - RESTAURANTE
# ==========================================

# Servidor
server.port=8080
server.servlet.context-path=/api

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/taller3
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT — en despliegue real, definir JWT_SECRET como variable de entorno y rotar el valor;
# el default acá solo existe para no romper el arranque local de desarrollo.
app.jwt.secret=${JWT_SECRET:UmVzdGF1cmFudGVQZW5zaW9uU2VjcmV0S2V5TXV5TGFyZ2EyMDI2QW50aGlheUJvbGl2aWE=}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Seguridad: max intentos antes de bloqueo
app.security.max-login-attempts=3

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Scheduler habilitado
spring.task.scheduling.pool.size=5

# Logs
logging.level.com.restaurante=INFO
logging.level.org.springframework.security=WARN

# IA generativa (sugerencias de receta) — proxy backend, nunca expuesto al frontend.
# Vacío = proveedor no configurado. Sobreescribir con variables de entorno en
# despliegue real: APP_AI_GEMINI_KEY / APP_AI_CLAUDE_KEY / APP_AI_OPENAI_KEY.
app.ai.gemini.key=
app.ai.claude.key=
app.ai.openai.key=

# Segunda semilla de datos de prueba (DatosPruebaRunner): segunda sucursal, insumos con
# unidades variadas, recetas, producción, pedidos, ventas, cliente y pensionado con
# historial. Desactivada por defecto — no debe correr en un arranque normal.
app.seed.datos-prueba=false
